# A same-process terminal UI layered over the official dsh-base profile.

- id: system-prompt
  config:
    persona: >-
      You are a coding agent powered by the {{model}} model. Your working directory is {{cwd}}.

- id: hmr
  disabled: true

- id: tools
  config:
    mode: !!js process.env.DSH_TOOLS_MODE

- insert:
    - id: code-runtime
      name: '@deepseek-ai/dsh-code-runtime-worker-thread'

    # dsh-base provides the question service but deliberately leaves the
    # model-facing tool to each UI/preset composition.
    - id: tool-ask-user
      name: '@deepseek-ai/dsh-tool-ask-user'

    - id: dsh-tui-startup
      name: 'dsh-tui/startup'

    - id: dsh-tui
      name: 'dsh-tui'
      inject: [dshTuiStartup]
      config:
        continueSession: !!js ctx.dshTuiStartup.continueSession
        resumeSessionId: !!js ctx.dshTuiStartup.resumeSessionId
        initialPrompt: !!js ctx.dshTuiStartup.initialPrompt
